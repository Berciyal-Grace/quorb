# Installed Dev channel only. Production remains manual in release.yml.
name: Quorb Dev
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'egdev6/quorb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Signing-setup tests exercise POSIX modes and symlinks; keep them on Linux.
      - run: npm test

  build:
    needs: checks
    if: github.repository == 'egdev6/quorb' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Prepare isolated Dev configuration
        id: prepare
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/dev-channel.mjs prepare "$env:BUILD_NUMBER" "$env:SOURCE_SHA"
      - name: Check frontend and both runtime channels
        run: |
          npx vitest run --dir src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/dev-channel.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location src-tauri
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TAURI_CONFIG = Get-Content ../.dev-build/tauri.dev.conf.json -Raw
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Require updater signing key (never print its value)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing updater signing key; no Dev build will be published."
            exit 1
          fi
      - name: Build signed immutable Dev prerelease (draft until complete)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseCommitish: ${{ github.sha }}
          tagName: dev-${{ github.run_id }}-${{ github.run_attempt }}
          releaseName: Quorb Dev ${{ steps.prepare.outputs.version }}
          releaseBody: 'Development build from main commit ${{ github.sha }}. Separate from production; updater requires public repository access.'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config .dev-build/tauri.dev.conf.json
      - name: Publish only this completed prerelease, never stable latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_TAG: dev-${{ github.run_id }}-${{ github.run_attempt }}
          DEV_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release download "$env:DEV_TAG" --repo egdev6/quorb --pattern latest.json --dir .dev-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dev-channel.mjs validate .dev-build/latest.json "$env:DEV_VERSION" "$env:DEV_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:DEV_TAG" --repo egdev6/quorb --draft=false --prerelease --latest=false

  feed:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Builds are NOT serialized/cancelled: each main push can finish its installer.
    # Only the rolling pointer is serialized. Late builds cannot downgrade it.
    concurrency:
      group: dev-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate and advance Dev feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ needs.build.outputs.version }}
          DEV_TAG: dev-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/dev-channel.mjs publish-feed "$DEV_VERSION" "$DEV_TAG" "$SOURCE_SHA"
