# Publica una release firmada al subir un tag vX.Y.Z:
#   npm run bump 0.2.0 && git commit -am "release v0.2.0" && git tag v0.2.0 && git push --follow-tags
# Secretos necesarios (Settings › Secrets and variables › Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contenido de ~/.tauri/quorb.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  la contraseña que pusiste al generarla
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencias
        run: npm install

      - name: Tests
        run: |
          npm test
          cd src-tauri
          cargo test

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quorb ${{ github.ref_name }}
          releaseBody: |
            Descarga el instalador `-setup.exe` (recomendado) o el `.msi`.
            Si ya tienes Quorb, se actualizará solo en las próximas horas.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Activa los ficheros firmados del updater solo aquí; «npm run app:build» funciona sin claves.
          args: --config src-tauri/tauri.release.conf.json
